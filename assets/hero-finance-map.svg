<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" fill="none" role="img" aria-labelledby="title desc" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="title">Biznesin maliyyə xəritəsi</title>
  <desc id="desc">Vergi, mühasibatlıq və kadr işləri dəqiq uçot, vaxtında hesabat, vicdanlı yanaşma və aydın təhlillə əmin qərarlara çevrilir.</desc>
  <defs>
    <linearGradient id="background" x1="42" y1="18" x2="585" y2="379" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7F0FD"/>
      <stop offset=".55" stop-color="#F6F9FF"/>
      <stop offset="1" stop-color="#E9F2FF"/>
    </linearGradient>
    <linearGradient id="chart-fill" x1="346" y1="202" x2="346" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA7F4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#DCEBFF" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="chart-line" x1="197" y1="271" x2="515" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A9BF0"/>
      <stop offset="1" stop-color="#2466D3"/>
    </linearGradient>
    <filter id="card-shadow" x="58" y="20" width="555" height="372" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#113765" flood-opacity=".12"/>
    </filter>
    <filter id="chip-shadow" x="0" y="10" width="640" height="370" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17416E" flood-opacity=".12"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#99BBE8" fill-opacity=".35"/>
    </pattern>
    <clipPath id="chart-clip"><rect x="151" y="179" width="381" height="116" rx="15"/></clipPath>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        #finance-map-line { stroke-dasharray:100; stroke-dashoffset:100; animation:finance-draw 7.29s linear 1 forwards; }
        #finance-map-chart-area { opacity:0; animation:finance-area 8.1s linear 1 forwards; }
        .finance-point-one { opacity:0; animation:finance-step-one 8.1s linear 1 forwards; }
        .finance-point-two { opacity:0; animation:finance-step-two 8.1s linear 1 forwards; }
        .finance-point-three { opacity:0; animation:finance-step-three 8.1s linear 1 forwards; }
        .finance-point-four { opacity:0; animation:finance-step-four 8.1s linear 1 forwards; }
        .finance-step-one { opacity:0; animation:finance-step-one 8.1s linear 1 forwards; }
        .finance-step-two { opacity:0; animation:finance-step-two 8.1s linear 1 forwards; }
        .finance-step-three { opacity:0; animation:finance-step-three 8.1s linear 1 forwards; }
        .finance-step-four { opacity:0; animation:finance-step-four 8.1s linear 1 forwards; }
        #finance-map-arrowhead { opacity:0; animation:finance-arrow 8.1s linear 1 forwards; }
        #finance-map-tax { opacity:0; animation:finance-edge-one 8.505s ease-out 1 forwards; }
        #finance-map-accounting { opacity:0; animation:finance-edge-two 8.505s ease-out 1 forwards; }
        #finance-map-decision { opacity:0; animation:finance-edge-three 8.505s ease-out 1 forwards; }
      }
      @media (prefers-reduced-motion: reduce) {
        #finance-map-line { stroke-dasharray:none; stroke-dashoffset:0; }
        #finance-map-chart-area,#finance-map-tax,#finance-map-accounting,#finance-map-decision { opacity:1; }
        .finance-point-one,.finance-point-two,.finance-point-three,.finance-point-four,.finance-step-one,.finance-step-two,.finance-step-three,.finance-step-four,#finance-map-arrowhead { opacity:1; }
      }
      @keyframes finance-draw { 0%{stroke-dashoffset:100;opacity:0} 7%{opacity:1} 58%,100%{stroke-dashoffset:0;opacity:1} }
      @keyframes finance-area { 0%,7%{opacity:0} 58%,100%{opacity:1} }
      @keyframes finance-step-one { 0%,16%{opacity:0} 19%,100%{opacity:1} }
      @keyframes finance-step-two { 0%,29%{opacity:0} 33%,100%{opacity:1} }
      @keyframes finance-step-three { 0%,43%{opacity:0} 47%,100%{opacity:1} }
      @keyframes finance-step-four { 0%,56%{opacity:0} 60%,100%{opacity:1} }
      @keyframes finance-arrow { 0%,57%{opacity:0} 59%,100%{opacity:1} }
      @keyframes finance-edge-one { 0%,61%{opacity:0;transform:translateY(5px)} 65%,100%{opacity:1;transform:translateY(0)} }
      @keyframes finance-edge-two { 0%,68%{opacity:0;transform:translateY(5px)} 72%,100%{opacity:1;transform:translateY(0)} }
      @keyframes finance-edge-three { 0%,75%{opacity:0;transform:translateY(5px)} 79%,100%{opacity:1;transform:translateY(0)} }
    </style>
  </defs>

  <rect x=".5" y=".5" width="639" height="389" rx="29.5" fill="url(#background)" stroke="#D5E3F6"/>
  <path d="M0 247C148 141 241 234 378 115C472 34 551 44 640 8" stroke="#9DC2F1" stroke-opacity=".28" stroke-width="2"/>
  <path d="M0 290C148 184 249 284 386 161C480 77 562 91 640 55" stroke="#9DC2F1" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="548" cy="67" r="168" fill="#9AC1F5" fill-opacity=".11"/>
  <circle cx="548" cy="67" r="129" stroke="#FFFFFF" stroke-opacity=".64"/>
  <circle cx="95" cy="337" r="148" fill="url(#dots)"/>

  <!-- The main card, chart line and floating cards are separate motion-ready SVG layers. -->
  <g transform="translate(339 196) scale(1.12) translate(-339 -196)">
  <g id="finance-map-main">
    <rect x="112" y="62" width="454" height="268" rx="23" fill="#FFFFFF" filter="url(#card-shadow)"/>
    <rect x="112.5" y="62.5" width="453" height="267" rx="22.5" stroke="#DCE7F5"/>
    <rect x="150" y="81" width="27" height="27" rx="8" fill="#E9F2FF"/>
    <path d="M157 100V94L161 96V91L165 93V88L170 90" stroke="#2466D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="187" y="99" fill="#527197" font-size="10.5" font-weight="800" letter-spacing="2">MALİYYƏ XƏRİTƏSİ</text>
    <text x="150" y="139" fill="#0C1D36" font-size="20.5" font-weight="800" letter-spacing="-.45">Biznesinizin maliyyə mənzərəsi</text>
    <text x="151" y="161" fill="#64748B" font-size="12">Vergi * Mühasibatlıq * Kadr işləri</text>

    <rect x="151" y="179" width="381" height="116" rx="15" fill="#F5F9FF" stroke="#E2ECF9"/>
    <g id="finance-map-grid" clip-path="url(#chart-clip)" stroke="#D9E7F8" stroke-dasharray="3 6">
      <path d="M188 210H517M188 237H517M188 264H517"/>
    </g>
    <g id="finance-map-chart" clip-path="url(#chart-clip)">
      <path id="finance-map-chart-area" d="M194 269C233 266 247 244 282 250C315 257 329 222 365 229C399 236 414 220 447 225C473 228 491 209 516 202V296H194Z" fill="url(#chart-fill)"/>
      <path id="finance-map-line" pathLength="100" d="M194 269C233 266 247 244 282 250C315 257 329 222 365 229C399 236 414 220 447 225C473 228 491 209 516 202" stroke="url(#chart-line)" stroke-width="3.5" stroke-linecap="round"/>
      <g id="finance-map-points" fill="#FFFFFF" stroke="#2466D3" stroke-width="2.5">
        <circle class="finance-point-one" cx="282" cy="250" r="5"/>
        <circle class="finance-point-two" cx="365" cy="229" r="5"/>
        <circle class="finance-point-three" cx="447" cy="225" r="5"/>
        <circle class="finance-point-four" cx="516" cy="202" r="6"/>
      </g>
    </g>

    <g id="finance-map-arrowhead" transform="translate(516 202) rotate(-16)">
      <path d="M-5 -4L5 0L-5 4L-2 0Z" fill="#0C1D36"/>
    </g>

    <g id="finance-map-step-labels" fill="#0C1D36" font-size="9.5" font-weight="800" text-anchor="middle">
      <g class="finance-step-one"><rect x="234" y="216" width="96" height="22" rx="7" fill="#FFFFFF" stroke="#CBD9EB"/><text x="282" y="231">Dəqiq uçot</text></g>
      <g class="finance-step-two"><rect x="307" y="260" width="116" height="22" rx="7" fill="#FFFFFF" stroke="#CBD9EB"/><text x="365" y="275">Vaxtında hesabat</text></g>
      <g class="finance-step-three"><rect x="389" y="183" width="116" height="22" rx="7" fill="#FFFFFF" stroke="#CBD9EB"/><text x="447" y="198">Vicdanlı yanaşma</text></g>
      <g class="finance-step-four"><rect x="462" y="228" width="98" height="22" rx="7" fill="#FFFFFF" stroke="#CBD9EB"/><text x="511" y="243">Aydın təhlil</text></g>
    </g>
  </g>
  </g>

  <g id="finance-map-tax" filter="url(#chip-shadow)">
    <g transform="translate(524 58.5) scale(.95) translate(-524 -58.5)">
    <rect x="429" y="28" width="190" height="61" rx="15" fill="#FFFFFF"/>
    <rect x="429.5" y="28.5" width="189" height="60" rx="14.5" stroke="#DBE7F7"/>
    <rect x="442" y="40" width="38" height="38" rx="11" fill="#EAF3FF"/>
    <g id="finance-icon-handshake" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="452" cy="50" r="3.2" stroke="#2466D3" stroke-width="1.8"/>
      <circle cx="470" cy="50" r="3.2" stroke="#2466D3" stroke-width="1.8"/>
      <path d="M445.5 66C446.5 61 449.5 58 453 58C455.8 58 458 59.5 460 61.5C462 59.5 464.3 58 467 58C470.5 58 473.5 61 474.5 66" stroke="#2466D3" stroke-width="1.8"/>
      <path d="M454 59L460 64.5L463 61.5L468 65" stroke="#2466D3" stroke-width="2.2"/>
      <path d="M460 64.5L457.5 67M463 61.5L466 58.5" stroke="#2466D3" stroke-width="1.7"/>
    </g>
    <text x="491" y="55" fill="#0C1D36" font-size="11.5" font-weight="800">Etibarlı münasibət</text>
    <text x="491" y="71" fill="#64748B" font-size="10.5">şəffaf ünsiyyət</text>
    </g>
  </g>

  <g id="finance-map-accounting" filter="url(#chip-shadow)">
    <g transform="translate(110.5 245) scale(.95) translate(-110.5 -245)">
    <rect x="18" y="211" width="185" height="68" rx="15" fill="#FFFFFF"/>
    <rect x="18.5" y="211.5" width="184" height="67" rx="14.5" stroke="#DBE7F7"/>
    <rect x="31" y="227" width="37" height="37" rx="10" fill="#EAF3FF"/>
    <g id="finance-icon-phone-mail" stroke="#2466D3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="36.5" y="233" width="13" height="23" rx="2.5" fill="#FFFFFF"/>
      <path d="M40.5 236H45.5M41.5 252.5H44.5"/>
      <rect x="47" y="241" width="16" height="12" rx="2" fill="#FFFFFF"/>
      <path d="M48.5 243L55 248L61.5 243M48.5 251L52.5 247.5M61.5 251L57.5 247.5"/>
    </g>
    <text x="78" y="239" fill="#0C1D36" font-size="11" font-weight="800">Operativ cavablama</text>
    <text x="78" y="256" fill="#64748B" font-size="10.5">vaxtında dəstək</text>
    </g>
  </g>

  <g id="finance-map-decision" filter="url(#chip-shadow)">
    <g transform="translate(498 336) scale(.95) translate(-498 -336)">
      <rect x="377" y="304" width="242" height="64" rx="15" fill="#FFFFFF" stroke="#DBE7F7"/>
      <rect x="391" y="317" width="32" height="32" rx="9" fill="#EAF3FF"/>
      <path d="M400 323H412L416 327V343H400Z" stroke="#2466D3" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M412 323.5V328H416M402.5 332H413M402.5 336H409" stroke="#2466D3" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M407 339L409.5 341.5L414 336.5" stroke="#2466D3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="432" y="333" fill="#0C1D36" font-size="13.5" font-weight="800">Əmin qərarlar</text>
      <text x="432" y="350" fill="#64748B" font-size="10.5">aydın məlumat əsasında</text>
    </g>
  </g>
</svg>
